# Checks every push to main and every pull request. It never deploys: deploys
# start from GitHub Releases (deploy.yml).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint, type-check, test and build
        run: npx nx run-many -t lint typecheck test build
        env:
          NX_NO_CLOUD: true
