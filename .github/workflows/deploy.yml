# Deploys a GitHub Release to the FTP hosting (tophost.it):
#   pre-release vX.Y.Z-beta.N → beta channel, beta/ folder (beta.spoticast.it)
#   release     vX.Y.Z        → production, site root (spoticast.it)
# The root .htaccess hands beta.<domain> to the beta/ folder (vite.config.mts).
# To promote a tested beta, publish a new release vX.Y.Z on the same commit.
# Run it by hand with a tag to redeploy an existing release.
#
# Only files that changed since the last deploy are uploaded (the action keeps
# a sync-state file in each folder). The charts/ folders are managed by the
# charts workflow and are never touched here.
#
# Repository settings → Secrets and variables → Actions:
#   secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   variables: VITE_SPOTIFY_CLIENT_ID (required)
#              FTP_SERVER_DIR (default "./"; the site root, e.g. "./www/")
#              FTP_PROTOCOL (default "ftps"; "ftp" if the host has no TLS)
#              VITE_BASE (default "/"; production only)
name: deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to redeploy (e.g. v1.4.0 or v1.4.0-beta.1)
        required: true
        type: string

# One FTP session at a time, shared with the charts workflow.
concurrency:
  group: ftp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ (github.event.release.prerelease || contains(inputs.tag, '-')) && 'beta' || 'production' }}
      url: ${{ (github.event.release.prerelease || contains(inputs.tag, '-')) && 'https://beta.spoticast.it' || 'https://spoticast.it' }}
    steps:
      - name: Resolve release channel
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            PRERELEASE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease --jq .isPrerelease)
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::Tag $TAG must be vX.Y.Z (release) or vX.Y.Z-beta.N (pre-release)."
            exit 1
          fi
          if [ "$PRERELEASE" = true ]; then
            if [[ "$TAG" != *-beta.* ]]; then
              echo "::error::$TAG is a pre-release: tag beta versions vX.Y.Z-beta.N."
              exit 1
            fi
            CHANNEL=beta DIR=beta/
          else
            if [[ "$TAG" == *-* ]]; then
              echo "::error::$TAG looks like a beta: mark the release as pre-release."
              exit 1
            fi
            CHANNEL=production DIR=
          fi
          echo "Deploying $TAG to the $CHANNEL channel."
          {
            echo "tag=$TAG"
            echo "channel=$CHANNEL"
            echo "dir=$DIR"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint, type-check and test
        run: npx nx run-many -t lint typecheck test
        env:
          NX_NO_CLOUD: true

      - name: Build
        run: npx nx build
        env:
          NX_NO_CLOUD: true
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          # The beta is the root of its subdomain.
          VITE_BASE: ${{ steps.release.outputs.channel == 'beta' && '/' || vars.VITE_BASE || '/' }}
          VITE_CHANNEL: ${{ steps.release.outputs.channel }}
          APP_VERSION: ${{ steps.release.outputs.tag }}
          APP_RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag }}

      - name: Upload changed files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: dist/spoticast/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}${{ steps.release.outputs.dir }}
          exclude: |
            **/.git*
            **/.git*/**
            charts/**
            beta/**
