# Deploys a tag to its channel:
#   vX.Y.Z-beta.N → beta, GitHub Pages (www.avol.io/spoticast)
#   vX.Y.Z        → production, FTP hosting (tophost.it, spoticast.it)
# Betas come from beta.yml on every push to develop (or from a pre-release);
# production from a published release vX.Y.Z. Run it by hand with a tag to
# redeploy it.
#
# Production uploads only the files that changed since the last deploy (the
# action keeps a sync-state file on the server). The charts/ folder is managed
# by the charts workflow and is never touched here. The beta downloads a
# snapshot of the charts at deploy time.
#
# Repository settings → Secrets and variables → Actions:
#   secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   variables: VITE_SPOTIFY_CLIENT_ID (required)
#              FTP_SERVER_DIR (default "./"; the site root, e.g. "./www/")
#              FTP_PROTOCOL (default "ftps"; "ftp" if the host has no TLS)
#              VITE_BASE (default "/"; production only)
# Repository settings → Pages: source "GitHub Actions". Environments →
# github-pages: allow the tags "v*" to deploy (by default only main can).
name: deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to redeploy (e.g. v1.4.0 or v1.4.0-beta.1)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release_url:
        description: Link to what's new in the app (default the tag's page)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pages deploys must run in the github-pages environment. Production holds
    # one FTP session at a time, shared with the charts workflow.
    environment:
      name: ${{ (github.event.release.prerelease || contains(inputs.tag, '-')) && 'github-pages' || 'production' }}
      url: ${{ steps.pages.outputs.page_url || 'https://spoticast.it' }}
    concurrency:
      group: ${{ (github.event.release.prerelease || contains(inputs.tag, '-')) && 'pages' || 'ftp' }}
      cancel-in-progress: false
    steps:
      - name: Resolve release channel
        id: release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::Tag $TAG must be vX.Y.Z (production) or vX.Y.Z-beta.N (beta)."
            exit 1
          fi
          if [[ "$TAG" == *-beta.* ]]; then CHANNEL=beta; else CHANNEL=production; fi
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            if [ "$PRERELEASE" = true ] && [ "$CHANNEL" != beta ]; then
              echo "::error::$TAG is a pre-release: tag beta versions vX.Y.Z-beta.N."
              exit 1
            fi
            if [ "$PRERELEASE" != true ] && [ "$CHANNEL" = beta ]; then
              echo "::error::$TAG looks like a beta: mark the release as pre-release."
              exit 1
            fi
          fi
          echo "Deploying $TAG to the $CHANNEL channel."
          {
            echo "tag=$TAG"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint, type-check and test
        run: npx nx run-many -t lint typecheck test
        env:
          NX_NO_CLOUD: true

      # A snapshot, so that Search has charts: they are not refreshed daily.
      - name: Download charts (beta)
        if: steps.release.outputs.channel == 'beta'
        continue-on-error: true
        run: node scripts/fetch-charts.mjs

      - name: Build
        run: npx nx build
        env:
          NX_NO_CLOUD: true
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          # The beta is served from /<repository>/ on GitHub Pages.
          VITE_BASE: ${{ steps.release.outputs.channel == 'beta' && format('/{0}/', github.event.repository.name) || vars.VITE_BASE || '/' }}
          VITE_CHANNEL: ${{ steps.release.outputs.channel }}
          APP_VERSION: ${{ steps.release.outputs.tag }}
          APP_RELEASE_URL: ${{ inputs.release_url || format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, steps.release.outputs.tag) }}

      # Pages has no .htaccess: 404.html is its single-page app fallback.
      - name: Prepare for GitHub Pages (beta)
        if: steps.release.outputs.channel == 'beta'
        run: |
          cp dist/spoticast/index.html dist/spoticast/404.html
          rm dist/spoticast/.htaccess

      - name: Upload to GitHub Pages (beta)
        if: steps.release.outputs.channel == 'beta'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/spoticast/

      - name: Deploy to GitHub Pages (beta)
        if: steps.release.outputs.channel == 'beta'
        id: pages
        uses: actions/deploy-pages@v4

      - name: Upload changed files via FTP (production)
        if: steps.release.outputs.channel == 'production'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: dist/spoticast/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            charts/**
