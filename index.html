<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spoticast</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#0f1115"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f6f7f9"
      media="(prefers-color-scheme: light)"
    />
    <script>
      // Theme before the first paint, as in useApplyPreferences.
      (function () {
        var theme = 'auto';
        try {
          var stored = localStorage.getItem('spoticast.settings');
          theme = (stored && JSON.parse(stored).state.theme) || theme;
        } catch (e) {
          // Blocked storage or a broken value: follow the system.
        }
        if (theme !== 'dark' && theme !== 'light')
          theme = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta name="description" content="Podcast client for Spotify" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
